{% extends "base.html" %}

{% block title %}Page Not Found – BlogNest{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 6rem 1.5rem;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--primary-600); line-height: 1;">404</div>
  <h1 style="font-size: 2rem; font-weight: 800; margin: 1rem 0 0.5rem; color: var(--text-dark);">Story or Page Not Found</h1>
  <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 2rem;">
    The post or page you are looking for might have been removed, had its name changed, or is a private draft.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return Home</a>
    <a href="{{ url_for('main.explore') }}" class="btn btn-outline">Explore Stories</a>
  </div>
</div>
{% endblock %}
