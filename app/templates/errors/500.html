{% extends "base.html" %}

{% block title %}Internal Server Error – BlogNest{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 6rem 1.5rem;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--danger); line-height: 1;">500</div>
  <h1 style="font-size: 2rem; font-weight: 800; margin: 1rem 0 0.5rem; color: var(--text-dark);">Unexpected Server Error</h1>
  <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 2rem;">
    Something went wrong on our end while processing your request. Please try again shortly.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
