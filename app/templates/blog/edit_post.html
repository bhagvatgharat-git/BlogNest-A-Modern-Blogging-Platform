{% extends "base.html" %}

{% block title %}Edit Story – {{ post.title }} – BlogNest{% endblock %}

{% block content %}
<div class="container" style="padding: 2.5rem 1.5rem 5rem;">
  <div class="form-card editor-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-light); padding-bottom: 1.25rem;">
      <div>
        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.35rem;">
          <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--text-dark);">Edit Story</h1>
          {% if post.is_published %}
            <span class="badge-status badge-published">Published</span>
          {% else %}
            <span class="badge-status badge-draft">Draft</span>
          {% endif %}
        </div>
        <p style="color: var(--text-muted); font-size: 0.92rem;">
          Last updated on {{ post.updated_at|format_date }}
        </p>
      </div>

      <!-- Live Stats Pills -->
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <span class="btn btn-outline btn-sm" id="editorWordCount" style="pointer-events: none;">0 words</span>
        <span class="btn btn-outline btn-sm" id="editorReadingTime" style="pointer-events: none; color: var(--primary-600);">1 min read</span>
      </div>
    </div>

    <form method="POST" action="{{ url_for('blog.edit_post', post_id=post.id) }}">
      <!-- Post Title -->
      <div class="form-group">
        <label for="title" class="form-label">Story Title <span style="color: var(--danger);">*</span></label>
        <input 
          type="text" 
          id="title" 
          name="title" 
          class="form-control" 
          style="font-size: 1.25rem; font-weight: 700; padding: 0.85rem 1.1rem;" 
          value="{{ post.title }}"
          required 
          autofocus
        >
      </div>

      <!-- Category and Cover Image Grid -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="category_id" class="form-label">Category / Topic</label>
          <select id="category_id" name="category_id" class="form-control">
            <option value="">Select a category (optional)</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}" {% if post.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="cover_image" class="form-label">Cover Image URL</label>
          <input 
            type="url" 
            id="cover_image" 
            name="cover_image" 
            class="form-control" 
            value="{{ post.cover_image or '' }}"
            placeholder="https://images.unsplash.com/photo-..."
          >
        </div>
      </div>

      <!-- Short Summary -->
      <div class="form-group">
        <label for="summary" class="form-label">Short Summary / Excerpt</label>
        <textarea 
          id="summary" 
          name="summary" 
          class="form-control" 
          rows="2" 
          placeholder="Brief 1-2 sentence overview shown in blog cards and social sharing..."
        >{{ post.summary or '' }}</textarea>
      </div>

      <!-- Main Content -->
      <div class="form-group">
        <label for="postContentInput" class="form-label">Story Content <span style="color: var(--danger);">*</span></label>
        <textarea 
          id="postContentInput" 
          name="content" 
          class="form-control editor-textarea" 
          placeholder="Write your article here..." 
          required
        >{{ post.content }}</textarea>
      </div>

      <!-- Actions -->
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 1.5rem; margin-top: 2rem;">
        <!-- Delete Button form -->
        <button 
          type="button" 
          class="btn btn-outline-danger btn-sm"
          onclick="if(confirm('Are you absolutely sure you want to delete this story? This cannot be undone.')) { document.getElementById('deleteForm').submit(); }"
        >
          🗑️ Delete Story
        </button>
        
        <div style="display: flex; gap: 1rem;">
          <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline">Cancel</a>
          <button type="submit" name="action" value="draft" class="btn btn-outline">
            💾 Save as Draft
          </button>
          <button type="submit" name="action" value="publish" class="btn btn-primary">
            🚀 Update &amp; Publish
          </button>
        </div>
      </div>
    </form>

    <!-- Hidden form for deleting the post -->
    <form id="deleteForm" method="POST" action="{{ url_for('blog.delete_post', post_id=post.id) }}" style="display: none;">
    </form>
  </div>
</div>
{% endblock %}
